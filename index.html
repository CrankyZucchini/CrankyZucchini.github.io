<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TesseractZ77</title>
<style>
:root{--bg:#f5f7f4;--fg:#17201b;--muted:#5b6a61;--line:#d9e1db;--accent:#1f8a5b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--fg:#e4ebe6;--muted:#97a69c;--line:#2a3530;--accent:#4cc28a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 16px}
h1{margin:0 0 4px;font-size:1.8rem}
p{margin:0;color:var(--muted)}
ul{list-style:none;padding:0;margin:32px 0 0;border-top:1px solid var(--line)}
li{padding:16px 0;border-bottom:1px solid var(--line)}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>TesseractZ77</h1>
  <p>Side projects and experiments.</p>
  <ul>
    <li><a href="volt-drain-demo/">Volt drain demo</a><p>Test bench for the social battery drain model behind Volt.</p></li>
  </ul>
</main>
</body>
</html>
